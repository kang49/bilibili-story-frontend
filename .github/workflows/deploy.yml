name: Deploy bilibili-story-frontend to g49node0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-/home/kang49/run_server/nodejs/bilibili-story-frontend}"

            if [ "$(stat -c '%U' "$APP_DIR")" != "$USER" ]; then
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R "$USER:$USER" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main
            git checkout -f -B main origin/main

            if git ls-files --error-unmatch yarn.lock >/dev/null 2>&1; then
              yarn install --frozen-lockfile
            else
              yarn install
            fi
            yarn build

            if printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 describe BiliShare_Frontend >/dev/null 2>&1; then
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 restart BiliShare_Frontend
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 save
            else
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S bash -c "cd '$APP_DIR' && PORT=3004 pm2 start .output/server/index.mjs --name BiliShare_Frontend && pm2 save"
            fi
